<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>GAIP · AI 对话</title>
    <link rel="icon" type="image/svg+xml" href="./assets/agent.svg" />
    <link rel="stylesheet" href="./src/styles.css?v=6" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="topbar">
        <button class="icon-button" id="history-button" aria-label="历史会话">
          <img src="./assets/history.svg?v=2" alt="" />
        </button>
        <div class="brand"><strong>GAIP Agent</strong></div>
        <button class="icon-button" id="new-button" aria-label="新建对话">
          <img src="./assets/new-chat.svg" alt="" />
        </button>
      </header>
      <section
        class="conversation"
        id="conversation"
        aria-label="对话内容"
        tabindex="0"
      >
        <div id="conversation-body"></div>
      </section>
      <button class="jump-bottom" id="jump-bottom" hidden>
        回到最新消息 ↓
      </button>
      <section
        id="voice-feedback"
        class="voice-feedback"
        aria-labelledby="voice-title"
        hidden
      >
        <div class="voice-scene" id="voice-scene" data-state="idle">
          <div class="voice-caption">
            <span class="record-dot"></span
            ><span id="voice-caption">正在聆听</span
            ><span class="voice-demo-label" id="voice-demo-label">演示</span>
          </div>
          <h2 id="voice-title">我在听，慢慢说。</h2>
          <p id="voice-hint">松开转文字 · 上移取消</p>
          <div class="voice-visual" id="voice-visual">
            <div class="voice-aura"></div>
            <div class="voice-wave" id="voice-wave" aria-hidden="true"></div>
            <div class="voice-timer">
              <span id="voice-time">00:00</span><small>/ 01:00</small>
            </div>
          </div>
          <div class="voice-status" id="voice-status" role="status">
            上移取消 · 移回继续
          </div>
        </div>
      </section>
      <footer class="composer-area">
        <div class="selection" id="selection"></div>
        <div class="attachment-tray" id="attachment-tray"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">输入消息</label>
          <textarea
            id="message"
            rows="1"
            maxlength="8000"
            placeholder="有问题，随时问我…"
          ></textarea>
          <div class="composer-tools">
            <div class="tool-group composer-left">
              <button
                type="button"
                class="icon-button attachment-button"
                id="attachment-button"
                aria-label="添加附件"
              >
                <img src="./assets/attach.svg" alt="" />
              </button>
              <button type="button" class="plan-button" id="plan-button">
                <img src="./assets/plan.svg" alt="" />做方案
              </button>
            </div>
            <div class="tool-group composer-right">
              <button
                type="button"
                class="icon-button voice-button"
                id="voice-button"
                aria-label="按住说话，松开转文字"
              >
                <img src="./assets/mic.svg" alt="" /><span
                  id="voice-main-label"
                  class="sr-only"
                  >按住说话</span
                >
              </button>
              <button
                type="submit"
                class="send-button"
                id="send-button"
                aria-label="发送消息"
                disabled
              >
                ↑
              </button>
            </div>
          </div>
        </form>
        <p class="disclaimer">AI 内容仅供参考，对客使用前请核实</p>
      </footer>
      <div class="toast" id="toast" role="status" hidden></div>
      <div
        id="announcement"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></div>
    </main>

    <dialog id="plans-dialog" class="sheet" aria-labelledby="plans-title">
      <div class="handle"></div>
      <header class="dialog-header">
        <div>
          <h2 id="plans-title">选择方案</h2>
          <p>选择后，在对话中补充需求即可</p>
        </div>
        <button class="icon-button close-dialog" aria-label="关闭方案选择">
          <img src="./assets/close.svg" alt="" />
        </button>
      </header>
      <div class="sheet-content">
        <div class="section-label">方案与分析</div>
        <div id="plan-list"></div>
      </div>
      <div class="sheet-footer">一次专注一个方案，随时可以切换</div>
    </dialog>

    <dialog id="history-dialog" class="drawer" aria-labelledby="history-title">
      <header class="dialog-header">
        <h2 id="history-title">历史会话</h2>
        <button class="icon-button close-dialog" aria-label="关闭历史会话">
          <img src="./assets/history-close.svg" alt="" />
        </button>
      </header>
      <button class="new-session" id="drawer-new">
        <img src="./assets/new-chat.svg" alt="" />新建对话
      </button>
      <div class="section-label">历史对话</div>
      <div id="history-list" class="history-list"></div>
      <p class="drawer-note">演示会话保存在当前浏览器</p>
    </dialog>

    <dialog
      id="history-actions-dialog"
      class="history-actions-dialog"
      aria-labelledby="history-actions-title"
      aria-describedby="history-action-name"
    >
      <header class="dialog-header">
        <h2 id="history-actions-title">会话管理</h2>
        <button
          class="icon-button"
          data-history-dismiss
          aria-label="关闭会话管理"
        >
          <img src="./assets/close.svg" alt="" />
        </button>
      </header>
      <p id="history-action-name" class="history-action-name"></p>
      <div id="history-actions-menu" class="history-actions-menu">
        <button id="history-rename">
          <img src="./assets/edit.svg" alt="" /><span>编辑名称</span>
        </button>
        <button id="history-delete" class="danger">
          <img src="./assets/delete.svg" alt="" /><span>删除会话</span>
        </button>
      </div>
      <form
        id="history-rename-form"
        class="history-edit-panel"
        hidden
        novalidate
      >
        <label for="history-name">会话名称</label>
        <input
          id="history-name"
          maxlength="60"
          autocomplete="off"
          enterkeyhint="done"
          aria-describedby="history-name-error"
        />
        <p id="history-name-error" class="field-error" aria-live="polite"></p>
        <div class="history-confirm-actions">
          <button type="button" data-history-dismiss>取消</button
          ><button type="submit" id="history-save" class="primary">保存</button>
        </div>
      </form>
      <div id="history-delete-panel" class="history-edit-panel" hidden>
        <p class="delete-description">
          这条会话的消息、草稿和所选方案将一起删除，删除后无法恢复。
        </p>
        <div class="history-confirm-actions">
          <button id="history-delete-cancel" data-history-dismiss>取消</button
          ><button id="history-delete-confirm" class="danger-fill">
            确认删除
          </button>
        </div>
      </div>
    </dialog>

    <dialog
      id="attachments-dialog"
      class="sheet attachment-sheet"
      aria-labelledby="attachments-title"
    >
      <div class="handle"></div>
      <header class="dialog-header">
        <div>
          <h2 id="attachments-title">添加附件</h2>
          <p>样板仅展示文件选择，不上传或解析</p>
        </div>
        <button class="icon-button close-dialog" aria-label="关闭附件选择">
          <img src="./assets/close.svg" alt="" />
        </button>
      </header>
      <div class="attachment-options">
        <button data-file-source="camera">
          <span>拍照</span><small>拍摄纸质资料或计划书</small><b>›</b>
        </button>
        <button data-file-source="photos">
          <span>从相册选择</span><small>照片、截图</small><b>›</b>
        </button>
        <button data-file-source="files">
          <span>选择文件</span><small>PDF、Word、Excel · 单个不超过 20 MB</small
          ><b>›</b>
        </button>
      </div>
    </dialog>
    <input
      id="camera-input"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
    <input id="photos-input" type="file" accept="image/*" multiple hidden />
    <input
      id="files-input"
      type="file"
      accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,image/*"
      multiple
      hidden
    />

    <dialog
      id="table-dialog"
      class="table-dialog"
      aria-labelledby="table-title"
    >
      <header class="dialog-header">
        <div>
          <h2 id="table-title">方案对比</h2>
          <p>左右滑动查看各方案，上下滑动查看项目</p>
        </div>
        <button class="icon-button close-dialog" aria-label="关闭全屏表格">
          <img src="./assets/close.svg" alt="" />
        </button>
      </header>
      <div id="full-table" class="full-table"></div>
      <div class="table-bottom">对比项目固定在左侧 · 示例数据，仅用于展示</div>
    </dialog>
    <script type="module" src="./src/app.js?v=6"></script>
  </body>
</html>
